name: Kernel build

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Device firmware payload (GPU/ADSP blobs for the initramfs)"
        default: "https://api.github.com/repos/Lymeeee/galaxy-tab-s9-fedora-extended/releases/assets/723491599"
        type: string
      firmware_sha256:
        description: "sha256 of the firmware payload"
        default: "30cace40556fdaf1577c76bedc1b1a6236f4acc23e9300253b3834fa7ed4bab5"
        type: string
      release_tag:
        description: "Immutable release tag (empty = kernel-7.2.0-<YYYYMMDD>.<run>); the same assets are mirrored to the rolling 'latest' release"
        default: ""
        type: string

env:
  KVER: 7.2.0-gts9wifi

permissions:
  contents: write

jobs:
  build-kernel:
    # Native arm64, full LLVM toolchain, same model as the pmOS kernel build.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Compute build id and release tag
        run: |
          build_id="$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          rel="${{ inputs.release_tag }}"
          [ -n "$rel" ] || rel="kernel-7.2.0-$build_id"
          {
            echo "BUILD_ID=$build_id"
            echo "REL=$rel"
          } >> "$GITHUB_ENV"
          echo "building $rel ($build_id, ${GITHUB_SHA})"

      - name: Checkout
        uses: actions/checkout@v4

      # Fail in seconds if the payload link is dead instead of after the
      # 50-minute kernel build.
      - name: Validate the firmware payload URL
        run: |
          curl -sfL --max-time 60 -r 0-1023 -o /dev/null \
            -H "Accept: application/octet-stream" \
            "${{ inputs.firmware_url }}"

      - name: Build kernel RPM, initramfs, boot bundle and TWRP zip
        run: |
          docker run --rm \
            -e KVER \
            -e BUILD_ID \
            -e BUILD_SHA='${{ github.sha }}' \
            -e BUILD_RUN='${{ github.run_id }}' \
            -e FIRMWARE_URL='${{ inputs.firmware_url }}' \
            -e FIRMWARE_SHA256='${{ inputs.firmware_sha256 }}' \
            -v "$PWD:/work" -w /work \
            quay.io/fedora/fedora:44 \
            bash -lc '
              set -euxo pipefail
              dnf -y install make gcc clang lld llvm bc flex bison perl \
                  openssl openssl-devel elfutils-libelf-devel python3 tar xz \
                  zstd rpm-build ccache dtc findutils dwarves dracut \
                  cpio lz4 iproute plymouth plymouth-plugin-script \
                  pkgconf-pkg-config cairo-devel pango-devel fontconfig-devel >/dev/null

              # --- kernel ---
              mkdir -p /tmp/kcache
              if [ ! -f /tmp/kcache/linux-7.2.tar.gz ]; then
                curl -sfL https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.tar.gz \
                  -o /tmp/kcache/linux-7.2.tar.gz
              fi
              tar xf /tmp/kcache/linux-7.2.tar.gz
              cd linux-7.2
              bash /work/kernel/prepare.sh .
              echo "-gts9wifi" > localversion-gts9wifi
              cd ..
              mv linux-7.2 linux-prepared
              tar czf linux-prepared.tar.gz linux-prepared
              rm -rf linux-prepared

              mkdir -p ~/rpmbuild/SOURCES out-kernel out-bundle out-twrp
              cp linux-prepared.tar.gz ~/rpmbuild/SOURCES/
              rpmbuild -bb --define "kversion 7.2.0" --define "buildid $BUILD_ID" \
                  /work/kernel/kernel.spec
              cp ~/rpmbuild/RPMS/aarch64/*.rpm out-kernel/

              # --- initramfs: install the RPM into the container, dracut ours ---
              dnf -y install out-kernel/*.rpm
              # The Adreno driver is built-in and probes inside the initramfs;
              # stage the device GPU firmware so the first fw request succeeds
              # (gts9wifi.conf install_items pulls these into the image).
              curl -sfL -H "Accept: application/octet-stream" \
                "$FIRMWARE_URL" -o /tmp/fw.tar.gz
              echo "$FIRMWARE_SHA256  /tmp/fw.tar.gz" | sha256sum -c -
              tar xzf /tmp/fw.tar.gz -C /
              # Off-mode charging screen: binary, fonts and dracut module.
              install -d /usr/share/gts9wifi /usr/share/fonts/gts9wifi
              install -m0644 /work/charger/fonts.conf /usr/share/gts9wifi/fonts.conf
              install -m0644 /work/charger/fonts/*.ttf /usr/share/fonts/gts9wifi/
              gcc -O2 -Wall -Wextra -o /usr/libexec/gts9wifi-lpcharge \
                  /work/charger/gts9wifi-lpcharge.c \
                  $(pkg-config --cflags --libs cairo pangocairo) -lm
              cp -a /work/boot/dracut/90gts9wifi-usbnet \
                  /work/boot/dracut/95gts9wifi-lpcharge \
                  /usr/lib/dracut/modules.d/
              cp /work/boot/dracut/dracut.conf.d/gts9wifi.conf /usr/lib/dracut/dracut.conf.d/
              install -d /usr/share/plymouth/themes/gts9wifi
              cp -a /work/boot/plymouth-theme-gts9wifi/. /usr/share/plymouth/themes/gts9wifi/
              plymouth-set-default-theme gts9wifi
              grep -q '^ShowDelay=' /etc/plymouth/plymouthd.conf || echo 'ShowDelay=0' >> /etc/plymouth/plymouthd.conf
              grep -q '^Theme=gts9wifi$' /etc/plymouth/plymouthd.conf
              dracut --kver "$KVER" --force /tmp/initramfs.img
              zcat /tmp/initramfs.img | cpio -it 2>/dev/null > /tmp/initramfs.list
              grep -qx 'usr/share/plymouth/themes/gts9wifi/gts9wifi.script' /tmp/initramfs.list
              grep -qx 'usr/share/plymouth/themes/gts9wifi/spinner-0084.png' /tmp/initramfs.list

              # --- boot bundle ---
              bash /work/boot/build-bundle.sh \
                --vmlinuz /boot/vmlinuz-"$KVER" \
                --dtb "/boot/dtbs-7.2.0-gts9wifi/qcom/sm8550-samsung-gts9wifi.dtb" \
                --initramfs /tmp/initramfs.img \
                --cmdline /work/boot/cmdline.txt \
                --bootconfig /work/boot/bootconfig.txt \
                --out out-bundle

              {
                echo "build_id=$BUILD_ID"
                echo "commit=$BUILD_SHA"
                echo "run_id=$BUILD_RUN"
              } >> out-bundle/BUILD-METADATA.txt

              # --- TWRP zip ---
              python3 /work/tools/make-twrp-zip.py out-bundle \
                out-twrp/gts9wifi-fedora-7.2.0-"$BUILD_ID".zip --project /work
            '

      - name: Fix ownership
        run: sudo chown -R $USER:$USER out-kernel out-bundle out-twrp
      - name: Publish immutable build and mirror to latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Rename the bundle checksums so they do not collide with the
          # rootfs workflow's SHA256SUMS in combined releases.
          mv out-bundle/SHA256SUMS out-bundle/BUNDLE-SHA256SUMS
          gh release view "$REL" >/dev/null 2>&1 || \
            gh release create "$REL" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Kernel 7.2.0 build $BUILD_ID" \
              --notes "Kernel 7.2.0, boot bundle and TWRP zip. Build $BUILD_ID, commit $GITHUB_SHA."
          gh release upload "$REL" --clobber \
            out-kernel/*.rpm \
            out-bundle/*.img out-bundle/BUNDLE-SHA256SUMS out-bundle/BUILD-METADATA.txt \
            out-twrp/*.zip

          # The rolling release is what gts9wifi-update uses by default.  Keep
          # exactly one kernel pair there; the immutable release above is the
          # pin/rollback anchor.
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --target "$GITHUB_SHA" --latest \
              --title "GTS9 Latest" \
              --notes "Rolling channel: newest userspace/dynpart RPMs and kernel bundle."
          gh release upload latest --clobber \
            out-kernel/*.rpm \
            out-bundle/*.img out-bundle/BUNDLE-SHA256SUMS out-bundle/BUILD-METADATA.txt \
            out-twrp/*.zip
          new_rpm=$(basename "$(echo out-kernel/*.rpm)")
          new_zip=$(basename "$(echo out-twrp/*.zip)")
          gh release view latest --json assets --jq '.assets[].name' \
            | grep -E '^linux-gts9wifi-.*\.rpm$|^gts9wifi-fedora-.*\.zip$' \
            | grep -vxF -e "$new_rpm" -e "$new_zip" \
            | while read -r old; do gh release delete-asset latest "$old" --yes; done || true
