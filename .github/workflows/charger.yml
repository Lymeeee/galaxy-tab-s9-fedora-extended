name: Charger preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'charger/**'
      - '.github/workflows/charger.yml'

permissions:
  contents: write

jobs:
  build-charger:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the charger and render a preview
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            quay.io/fedora/fedora:44 \
            bash -lc '
              set -euxo pipefail
              dnf -y install gcc make pkgconf-pkg-config cairo-devel \
                  pango-devel fontconfig-devel >/dev/null
              mkdir -p out-charger
              gcc -O2 -Wall -Wextra -o out-charger/gts9wifi-lpcharge \
                  charger/gts9wifi-lpcharge.c \
                  $(pkg-config --cflags --libs cairo pangocairo) -lm
              install -d /usr/share/gts9wifi /usr/share/fonts/gts9wifi
              install -m0644 charger/fonts.conf /usr/share/gts9wifi/fonts.conf
              install -m0644 charger/fonts/*.ttf /usr/share/fonts/gts9wifi/
              out-charger/gts9wifi-lpcharge --preview out-charger/charge-preview.png
            '

      - name: Publish the charger and preview
        env:
          GH_TOKEN: ${{ github.token }}
          REL: latest
        run: |
          gh release view "$REL" >/dev/null 2>&1 || \
            gh release create "$REL" --target "$GITHUB_SHA" --latest \
              --title "GTS9 Latest" \
              --notes "Rolling channel: newest userspace/dynpart RPMs and kernel bundle."
          gh release upload "$REL" --clobber \
            out-charger/gts9wifi-lpcharge \
            out-charger/charge-preview.png
