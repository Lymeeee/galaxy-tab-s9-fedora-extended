name: Userspace RPM

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the userspace RPM to"
        required: false
        default: "latest"
        type: string
  push:
    branches: [main]
    paths:
      - 'userspace/**'
      - '.github/workflows/userspace.yml'

permissions:
  contents: write

jobs:
  build-userspace:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build aarch64 RPM
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            quay.io/fedora/fedora:44 \
            bash -lc '
              set -euxo pipefail
              dnf -y install rpm-build systemd-rpm-macros glib2 glib2-devel libgtop2-devel gcc findutils tar gzip sed python3 desktop-file-utils python3-gobject gtk4 libadwaita >/dev/null
              python3 -m py_compile /work/userspace/tree/usr/bin/gts9wifi-settings /work/userspace/tree/usr/libexec/gts9wifi-power-key /work/userspace/tree/usr/libexec/gts9wifi-wifi-bdf /work/userspace/tree/usr/libexec/gts9wifi-spen-remote /work/userspace/tree/usr/libexec/gts9wifi-rtc-time
              rm -rf /work/userspace/tree/usr/bin/__pycache__ /work/userspace/tree/usr/libexec/__pycache__
              python3 /work/userspace/tests/settings-smoke.py
              python3 /work/userspace/tests/libwacom-tablet.py
              python3 /work/userspace/tests/bt-provision-dtb.py
              python3 /work/userspace/tests/rtc-anchor.py
              sh -n /work/userspace/tree/usr/libexec/gts9wifi-mirrors
              sh -n /work/userspace/tree/usr/libexec/gts9wifi-protect
              sh -n /work/userspace/tree/usr/libexec/gts9wifi-ime
              sh -n /work/userspace/tree/usr/libexec/gts9wifi-powerkey-mode
              sh -n /work/userspace/tree/usr/libexec/gts9wifi-charge-guard
              sh -n /work/userspace/tree/usr/libexec/gts9wifi-keyboard-fw
              sh -n /work/userspace/tree/usr/libexec/gts9wifi-panel-coldboot-check
              desktop-file-validate /work/userspace/tree/usr/share/applications/gts9wifi-settings.desktop
              find /work/userspace/tree -type d -name __pycache__ -prune -exec rm -rf {} +
              mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/RPMS /work/out-userspace
              rm -rf /tmp/src
              VERSION=$(sed -n "s/^Version:[[:space:]]*//p" /work/userspace/gts9wifi-userspace.spec | head -1)
              mkdir -p "/tmp/src/gts9wifi-userspace-$VERSION"
              cp -a /work/userspace/tree/. "/tmp/src/gts9wifi-userspace-$VERSION/"
              tar -C /tmp/src -czf ~/rpmbuild/SOURCES/gts9wifi-userspace-$VERSION.tar.gz \
                "gts9wifi-userspace-$VERSION"
              cp /work/userspace/cpuinfo/gts9-cpuinfo.c ~/rpmbuild/SOURCES/
              rpmbuild -bb /work/userspace/gts9wifi-userspace.spec
              cp ~/rpmbuild/RPMS/aarch64/*.rpm /work/out-userspace/
            '

      - name: Publish and keep only the newest userspace RPM
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REL: ${{ inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          [ -n "$REL" ] || { echo "release tag is empty" >&2; exit 1; }
          gh release view "$REL" >/dev/null 2>&1 || \
            gh release create "$REL" --target "$GITHUB_SHA" --latest \
              --title "GTS9 Latest" \
              --notes "Rolling channel: newest userspace/dynpart RPMs and kernel bundle."
          gh release upload "$REL" --clobber out-userspace/*.rpm
          if [ "$REL" = latest ]; then
            new=$(basename "$(echo out-userspace/*.rpm)")
            gh release view latest --json assets --jq '.assets[].name' \
              | grep -E '^gts9wifi-userspace-.*\.(aarch64|noarch)\.rpm$' \
              | grep -vxF "$new" \
              | while read -r old; do gh release delete-asset latest "$old" --yes; done || true
          fi
