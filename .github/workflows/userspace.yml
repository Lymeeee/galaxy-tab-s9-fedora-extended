name: Userspace RPM

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the userspace RPM to"
        required: false
        default: "kernel-7.2.0-merge-1"
        type: string
  push:
    branches: [phase1-userspace]
    paths:
      - 'userspace/**'
      - '.github/workflows/userspace.yml'

permissions:
  contents: write

jobs:
  build-userspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build noarch RPM
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            quay.io/fedora/fedora:44 \
            bash -lc '
              set -euxo pipefail
              dnf -y install rpm-build systemd-rpm-macros glib2 findutils tar gzip sed python3 desktop-file-utils python3-gobject gtk4 libadwaita >/dev/null
              python3 -m py_compile /work/userspace/tree/usr/bin/gts9wifi-settings
              rm -rf /work/userspace/tree/usr/bin/__pycache__
              python3 /work/userspace/tests/settings-smoke.py
              desktop-file-validate /work/userspace/tree/usr/share/applications/gts9wifi-settings.desktop
              mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/RPMS /work/out-userspace
              rm -rf /tmp/src
              VERSION=$(sed -n "s/^Version:[[:space:]]*//p" /work/userspace/gts9wifi-userspace.spec | head -1)
              mkdir -p "/tmp/src/gts9wifi-userspace-$VERSION"
              cp -a /work/userspace/tree/. "/tmp/src/gts9wifi-userspace-$VERSION/"
              tar -C /tmp/src -czf ~/rpmbuild/SOURCES/gts9wifi-userspace-$VERSION.tar.gz \
                "gts9wifi-userspace-$VERSION"
              rpmbuild -bb /work/userspace/gts9wifi-userspace.spec
              cp ~/rpmbuild/RPMS/noarch/*.rpm /work/out-userspace/
            '

      - name: Publish to the named release
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ inputs.release_tag || 'kernel-7.2.0-merge-1' }}
        run: |
          [ -n "$REL" ] || { echo "release tag is empty" >&2; exit 1; }
          gh release view "$REL" >/dev/null 2>&1 || \
            gh release create "$REL" --title "Experimental Test Build ($REL)" \
              --prerelease --latest=false --notes "Automated build for $REL"
          gh release upload "$REL" --clobber out-userspace/*.rpm
