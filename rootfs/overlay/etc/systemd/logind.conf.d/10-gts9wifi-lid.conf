# Tab S9 (SM-X710) 电源管理策略：
# 1. 合盖挂起（merge-8 起 suspend 已正常）；电源键仍交给 gts9wifi-power-key
# 2. 避免快速开合盖时的防抖延迟（HoldoffTimeoutSec=0）
# 3. 避免长时间空闲时触发 systemd 自动挂起

[Login]
HandlePowerKey=lock
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend
IdleAction=lock
HoldoffTimeoutSec=0
