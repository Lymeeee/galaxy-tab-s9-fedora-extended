# logind ignores the lid switch for HoldoffTimeoutSec after every resume,
# 30 s by default.  On a tablet whose cover is effectively the off switch,
# closing it shortly after waking is common; the reference port measured
# every close inside that window being dropped.  The Wacom digitiser only
# reports on a real state change, so a settle window is all that is needed.
[Login]
HoldoffTimeoutSec=5s
