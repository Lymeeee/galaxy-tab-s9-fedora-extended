# zram-backed swap: tune VM reclaim for zero-seek in-RAM compressed swap.
# Higher watermark_scale_factor (8% of RAM -> low ~630 MiB, high ~1.22 GiB
# on 7.2 GiB RAM) wakes kswapd proactively around 60-70% utilization instead
# of waiting until free memory is nearly exhausted.
vm.swappiness = 200
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 800
