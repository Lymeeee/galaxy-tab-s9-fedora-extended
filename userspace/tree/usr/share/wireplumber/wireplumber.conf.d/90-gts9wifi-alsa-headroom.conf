# Give Qualcomm q6apm AudioReach (480-sample / 10 ms period) headroom so
# volume ramps and seeks do not collide with in-flight ADSP DMA fragments.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.headroom    = 1024
        api.alsa.period-size = 480
      }
    }
  }
]
