# SPDX-License-Identifier: MIT
# 1. Give Qualcomm q6apm AudioReach (480-sample / 10 ms period) headroom so
#    volume ramps and seeks do not collide with in-flight ADSP DMA fragments,
#    and expose a clean short name ("CS35L45 Direct") for the raw speaker sink.
# 2. Disable the unused ALSA Compress-Offload virtual card (alsa_card.comprC*)
#    so it does not clutter audio device lists.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.comprC.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.headroom    = 1024
        api.alsa.period-size = 480
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        node.description = "CS35L45 Direct"
        node.nick        = "CS35L45 Direct"
        media.class      = "Audio/Sink/Internal"
      }
    }
  }
]
