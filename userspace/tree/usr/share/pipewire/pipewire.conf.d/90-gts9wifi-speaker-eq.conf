# SPDX-License-Identifier: MIT
# Built-in PipeWire 4.0 speaker tuning for Samsung Galaxy Tab S9 (SM-X710):
# Calf Bass Enhancer (LV2, front/rear stereo pairs) + 9-band biquad EQ per
# channel (converted 1:1 from s9.json) feeding 4-channel PRIMARY_TDM_RX_0.
# Runs inside PipeWire's real-time graph with zero EasyEffects overhead.
# Users can customize by copying to:
#   ~/.config/pipewire/pipewire.conf.d/90-gts9wifi-speaker-eq.conf
# and setting `context.properties = { gts9wifi.speaker-eq.custom = true }`
# (handled automatically by gts9wifi-settings) so PipeWire skips this default
# instance instead of loading both.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        condition = [ { gts9wifi.speaker-eq.custom = !true } ]
        args = {
            node.description = "内置扬声器"
            media.name       = "内置扬声器"
            filter.graph = {
                nodes = [
                    {
                        type   = lv2
                        name   = bass_enhancer_f
                        plugin = "http://calf.sourceforge.net/plugins/BassEnhancer"
                        control = {
                            "bypass"       = 0.0
                            "level_in"     = 1.0
                            "level_out"    = 0.398107
                            "amount"       = 3.162278
                            "drive"        = 10.0
                            "blend"        = 0.0
                            "freq"         = 180.0
                            "listen"       = 0.0
                            "floor_active" = 1.0
                            "floor"        = 40.0
                        }
                    }
                    {
                        type   = lv2
                        name   = bass_enhancer_r
                        plugin = "http://calf.sourceforge.net/plugins/BassEnhancer"
                        control = {
                            "bypass"       = 0.0
                            "level_in"     = 1.0
                            "level_out"    = 0.398107
                            "amount"       = 3.162278
                            "drive"        = 10.0
                            "blend"        = 0.0
                            "freq"         = 180.0
                            "listen"       = 0.0
                            "floor_active" = 1.0
                            "floor"        = 40.0
                        }
                    }
                    # Front Left: 48 Hz x4 high-pass + 8 peaking bands
                    { type = builtin name = hpf1_fl label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf2_fl label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf3_fl label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf4_fl label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = eq1_fl  label = bq_peaking  control = { "Freq" = 160.0   "Q" = 0.6 "Gain" =  12.0 } }
                    { type = builtin name = eq2_fl  label = bq_peaking  control = { "Freq" = 300.0   "Q" = 1.2 "Gain" =  -2.0 } }
                    { type = builtin name = eq3_fl  label = bq_peaking  control = { "Freq" = 650.0   "Q" = 1.8 "Gain" = -14.0 } }
                    { type = builtin name = eq4_fl  label = bq_peaking  control = { "Freq" = 1150.0  "Q" = 1.6 "Gain" =  -8.0 } }
                    { type = builtin name = eq5_fl  label = bq_peaking  control = { "Freq" = 2200.0  "Q" = 1.4 "Gain" =  -7.0 } }
                    { type = builtin name = eq6_fl  label = bq_peaking  control = { "Freq" = 3500.0  "Q" = 1.8 "Gain" =  -6.0 } }
                    { type = builtin name = eq7_fl  label = bq_peaking  control = { "Freq" = 7500.0  "Q" = 1.0 "Gain" =  -6.0 } }
                    { type = builtin name = eq8_fl  label = bq_peaking  control = { "Freq" = 16000.0 "Q" = 0.8 "Gain" =   3.0 } }

                    # Front Right: 48 Hz x4 high-pass + 8 peaking bands
                    { type = builtin name = hpf1_fr label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf2_fr label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf3_fr label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf4_fr label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = eq1_fr  label = bq_peaking  control = { "Freq" = 160.0   "Q" = 0.6 "Gain" =  12.0 } }
                    { type = builtin name = eq2_fr  label = bq_peaking  control = { "Freq" = 300.0   "Q" = 1.2 "Gain" =  -2.0 } }
                    { type = builtin name = eq3_fr  label = bq_peaking  control = { "Freq" = 650.0   "Q" = 1.8 "Gain" = -14.0 } }
                    { type = builtin name = eq4_fr  label = bq_peaking  control = { "Freq" = 1150.0  "Q" = 1.6 "Gain" =  -8.0 } }
                    { type = builtin name = eq5_fr  label = bq_peaking  control = { "Freq" = 2200.0  "Q" = 1.4 "Gain" =  -7.0 } }
                    { type = builtin name = eq6_fr  label = bq_peaking  control = { "Freq" = 3500.0  "Q" = 1.8 "Gain" =  -6.0 } }
                    { type = builtin name = eq7_fr  label = bq_peaking  control = { "Freq" = 7500.0  "Q" = 1.0 "Gain" =  -6.0 } }
                    { type = builtin name = eq8_fr  label = bq_peaking  control = { "Freq" = 16000.0 "Q" = 0.8 "Gain" =   3.0 } }

                    # Rear Left: 48 Hz x4 high-pass + 8 peaking bands
                    { type = builtin name = hpf1_rl label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf2_rl label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf3_rl label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf4_rl label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = eq1_rl  label = bq_peaking  control = { "Freq" = 160.0   "Q" = 0.6 "Gain" =  12.0 } }
                    { type = builtin name = eq2_rl  label = bq_peaking  control = { "Freq" = 300.0   "Q" = 1.2 "Gain" =  -2.0 } }
                    { type = builtin name = eq3_rl  label = bq_peaking  control = { "Freq" = 650.0   "Q" = 1.8 "Gain" = -14.0 } }
                    { type = builtin name = eq4_rl  label = bq_peaking  control = { "Freq" = 1150.0  "Q" = 1.6 "Gain" =  -8.0 } }
                    { type = builtin name = eq5_rl  label = bq_peaking  control = { "Freq" = 2200.0  "Q" = 1.4 "Gain" =  -7.0 } }
                    { type = builtin name = eq6_rl  label = bq_peaking  control = { "Freq" = 3500.0  "Q" = 1.8 "Gain" =  -6.0 } }
                    { type = builtin name = eq7_rl  label = bq_peaking  control = { "Freq" = 7500.0  "Q" = 1.0 "Gain" =  -6.0 } }
                    { type = builtin name = eq8_rl  label = bq_peaking  control = { "Freq" = 16000.0 "Q" = 0.8 "Gain" =   3.0 } }

                    # Rear Right: 48 Hz x4 high-pass + 8 peaking bands
                    { type = builtin name = hpf1_rr label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf2_rr label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf3_rr label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf4_rr label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = eq1_rr  label = bq_peaking  control = { "Freq" = 160.0   "Q" = 0.6 "Gain" =  12.0 } }
                    { type = builtin name = eq2_rr  label = bq_peaking  control = { "Freq" = 300.0   "Q" = 1.2 "Gain" =  -2.0 } }
                    { type = builtin name = eq3_rr  label = bq_peaking  control = { "Freq" = 650.0   "Q" = 1.8 "Gain" = -14.0 } }
                    { type = builtin name = eq4_rr  label = bq_peaking  control = { "Freq" = 1150.0  "Q" = 1.6 "Gain" =  -8.0 } }
                    { type = builtin name = eq5_rr  label = bq_peaking  control = { "Freq" = 2200.0  "Q" = 1.4 "Gain" =  -7.0 } }
                    { type = builtin name = eq6_rr  label = bq_peaking  control = { "Freq" = 3500.0  "Q" = 1.8 "Gain" =  -6.0 } }
                    { type = builtin name = eq7_rr  label = bq_peaking  control = { "Freq" = 7500.0  "Q" = 1.0 "Gain" =  -6.0 } }
                    { type = builtin name = eq8_rr  label = bq_peaking  control = { "Freq" = 16000.0 "Q" = 0.8 "Gain" =   3.0 } }
                ]
                links = [
                    { output = "bass_enhancer_f:out_l" input = "hpf1_fl:In" }
                    { output = "hpf1_fl:Out"           input = "hpf2_fl:In" }
                    { output = "hpf2_fl:Out"           input = "hpf3_fl:In" }
                    { output = "hpf3_fl:Out"           input = "hpf4_fl:In" }
                    { output = "hpf4_fl:Out"           input = "eq1_fl:In"  }
                    { output = "eq1_fl:Out"            input = "eq2_fl:In"  }
                    { output = "eq2_fl:Out"            input = "eq3_fl:In"  }
                    { output = "eq3_fl:Out"            input = "eq4_fl:In"  }
                    { output = "eq4_fl:Out"            input = "eq5_fl:In"  }
                    { output = "eq5_fl:Out"            input = "eq6_fl:In"  }
                    { output = "eq6_fl:Out"            input = "eq7_fl:In"  }
                    { output = "eq7_fl:Out"            input = "eq8_fl:In"  }

                    { output = "bass_enhancer_f:out_r" input = "hpf1_fr:In" }
                    { output = "hpf1_fr:Out"           input = "hpf2_fr:In" }
                    { output = "hpf2_fr:Out"           input = "hpf3_fr:In" }
                    { output = "hpf3_fr:Out"           input = "hpf4_fr:In" }
                    { output = "hpf4_fr:Out"           input = "eq1_fr:In"  }
                    { output = "eq1_fr:Out"            input = "eq2_fr:In"  }
                    { output = "eq2_fr:Out"            input = "eq3_fr:In"  }
                    { output = "eq3_fr:Out"            input = "eq4_fr:In"  }
                    { output = "eq4_fr:Out"            input = "eq5_fr:In"  }
                    { output = "eq5_fr:Out"            input = "eq6_fr:In"  }
                    { output = "eq6_fr:Out"            input = "eq7_fr:In"  }
                    { output = "eq7_fr:Out"            input = "eq8_fr:In"  }

                    { output = "bass_enhancer_r:out_l" input = "hpf1_rl:In" }
                    { output = "hpf1_rl:Out"           input = "hpf2_rl:In" }
                    { output = "hpf2_rl:Out"           input = "hpf3_rl:In" }
                    { output = "hpf3_rl:Out"           input = "hpf4_rl:In" }
                    { output = "hpf4_rl:Out"           input = "eq1_rl:In"  }
                    { output = "eq1_rl:Out"            input = "eq2_rl:In"  }
                    { output = "eq2_rl:Out"            input = "eq3_rl:In"  }
                    { output = "eq3_rl:Out"            input = "eq4_rl:In"  }
                    { output = "eq4_rl:Out"            input = "eq5_rl:In"  }
                    { output = "eq5_rl:Out"            input = "eq6_rl:In"  }
                    { output = "eq6_rl:Out"            input = "eq7_rl:In"  }
                    { output = "eq7_rl:Out"            input = "eq8_rl:In"  }

                    { output = "bass_enhancer_r:out_r" input = "hpf1_rr:In" }
                    { output = "hpf1_rr:Out"           input = "hpf2_rr:In" }
                    { output = "hpf2_rr:Out"           input = "hpf3_rr:In" }
                    { output = "hpf3_rr:Out"           input = "hpf4_rr:In" }
                    { output = "hpf4_rr:Out"           input = "eq1_rr:In"  }
                    { output = "eq1_rr:Out"            input = "eq2_rr:In"  }
                    { output = "eq2_rr:Out"            input = "eq3_rr:In"  }
                    { output = "eq3_rr:Out"            input = "eq4_rr:In"  }
                    { output = "eq4_rr:Out"            input = "eq5_rr:In"  }
                    { output = "eq5_rr:Out"            input = "eq6_rr:In"  }
                    { output = "eq6_rr:Out"            input = "eq7_rr:In"  }
                    { output = "eq7_rr:Out"            input = "eq8_rr:In"  }
                ]
                inputs  = [ "bass_enhancer_f:in_l" "bass_enhancer_f:in_r" "bass_enhancer_r:in_l" "bass_enhancer_r:in_r" ]
                outputs = [ "eq8_fl:Out" "eq8_fr:Out" "eq8_rl:Out" "eq8_rr:Out" ]
            }
            audio.channels = 4
            audio.position = [ FL FR RL RR ]
            capture.props = {
                node.name            = "gts9wifi_speaker_eq"
                node.description     = "内置扬声器"
                media.class          = Audio/Sink
                device.form-factor   = "speaker"
                device.icon-name     = "audio-speakers"
                priority.session     = 1500
                priority.driver      = 1500
                state.default-volume = 0.027
            }
            playback.props = {
                node.name     = "gts9wifi_speaker_eq_out"
                node.passive  = true
                target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
            }
        }
    }
]
