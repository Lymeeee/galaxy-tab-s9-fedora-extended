# SPDX-License-Identifier: MIT
# Built-in PipeWire speaker tuning for Samsung Galaxy Tab S9 (SM-X710):
# Calf Bass Enhancer (LV2) + 9-band biquad EQ (converted 1:1 from s9.json).
# Runs inside PipeWire's real-time graph with zero EasyEffects overhead.
# Users can customize by copying to:
#   ~/.config/pipewire/pipewire.conf.d/90-gts9wifi-speaker-eq.conf
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "平板内置扬声器 (调音)"
            media.name       = "平板内置扬声器 (调音)"
            filter.graph = {
                nodes = [
                    {
                        type   = lv2
                        name   = bass_enhancer
                        plugin = "http://calf.sourceforge.net/plugins/BassEnhancer"
                        control = {
                            "bypass"       = 0.0
                            "level_in"     = 1.0
                            "level_out"    = 0.398107
                            "amount"       = 3.162278
                            "drive"        = 10.0
                            "blend"        = 0.0
                            "freq"         = 180.0
                            "listen"       = 0.0
                            "floor_active" = 1.0
                            "floor"        = 40.0
                        }
                    }
                    # Left channel: 48 Hz x4 high-pass + 8 peaking bands
                    { type = builtin name = hpf1_l label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf2_l label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf3_l label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf4_l label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = eq1_l  label = bq_peaking  control = { "Freq" = 160.0   "Q" = 0.6 "Gain" =  12.0 } }
                    { type = builtin name = eq2_l  label = bq_peaking  control = { "Freq" = 300.0   "Q" = 1.2 "Gain" =  -2.0 } }
                    { type = builtin name = eq3_l  label = bq_peaking  control = { "Freq" = 650.0   "Q" = 1.8 "Gain" = -14.0 } }
                    { type = builtin name = eq4_l  label = bq_peaking  control = { "Freq" = 1150.0  "Q" = 1.6 "Gain" =  -8.0 } }
                    { type = builtin name = eq5_l  label = bq_peaking  control = { "Freq" = 2200.0  "Q" = 1.4 "Gain" =  -7.0 } }
                    { type = builtin name = eq6_l  label = bq_peaking  control = { "Freq" = 3500.0  "Q" = 1.8 "Gain" =  -6.0 } }
                    { type = builtin name = eq7_l  label = bq_peaking  control = { "Freq" = 7500.0  "Q" = 1.0 "Gain" =  -6.0 } }
                    { type = builtin name = eq8_l  label = bq_peaking  control = { "Freq" = 16000.0 "Q" = 0.8 "Gain" =   3.0 } }

                    # Right channel: 48 Hz x4 high-pass + 8 peaking bands
                    { type = builtin name = hpf1_r label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf2_r label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf3_r label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = hpf4_r label = bq_highpass control = { "Freq" = 48.0    "Q" = 0.5 } }
                    { type = builtin name = eq1_r  label = bq_peaking  control = { "Freq" = 160.0   "Q" = 0.6 "Gain" =  12.0 } }
                    { type = builtin name = eq2_r  label = bq_peaking  control = { "Freq" = 300.0   "Q" = 1.2 "Gain" =  -2.0 } }
                    { type = builtin name = eq3_r  label = bq_peaking  control = { "Freq" = 650.0   "Q" = 1.8 "Gain" = -14.0 } }
                    { type = builtin name = eq4_r  label = bq_peaking  control = { "Freq" = 1150.0  "Q" = 1.6 "Gain" =  -8.0 } }
                    { type = builtin name = eq5_r  label = bq_peaking  control = { "Freq" = 2200.0  "Q" = 1.4 "Gain" =  -7.0 } }
                    { type = builtin name = eq6_r  label = bq_peaking  control = { "Freq" = 3500.0  "Q" = 1.8 "Gain" =  -6.0 } }
                    { type = builtin name = eq7_r  label = bq_peaking  control = { "Freq" = 7500.0  "Q" = 1.0 "Gain" =  -6.0 } }
                    { type = builtin name = eq8_r  label = bq_peaking  control = { "Freq" = 16000.0 "Q" = 0.8 "Gain" =   3.0 } }
                ]
                links = [
                    { output = "bass_enhancer:out_l" input = "hpf1_l:In" }
                    { output = "hpf1_l:Out"          input = "hpf2_l:In" }
                    { output = "hpf2_l:Out"          input = "hpf3_l:In" }
                    { output = "hpf3_l:Out"          input = "hpf4_l:In" }
                    { output = "hpf4_l:Out"          input = "eq1_l:In"  }
                    { output = "eq1_l:Out"           input = "eq2_l:In"  }
                    { output = "eq2_l:Out"           input = "eq3_l:In"  }
                    { output = "eq3_l:Out"           input = "eq4_l:In"  }
                    { output = "eq4_l:Out"           input = "eq5_l:In"  }
                    { output = "eq5_l:Out"           input = "eq6_l:In"  }
                    { output = "eq6_l:Out"           input = "eq7_l:In"  }
                    { output = "eq7_l:Out"           input = "eq8_l:In"  }

                    { output = "bass_enhancer:out_r" input = "hpf1_r:In" }
                    { output = "hpf1_r:Out"          input = "hpf2_r:In" }
                    { output = "hpf2_r:Out"          input = "hpf3_r:In" }
                    { output = "hpf3_r:Out"          input = "hpf4_r:In" }
                    { output = "hpf4_r:Out"          input = "eq1_r:In"  }
                    { output = "eq1_r:Out"           input = "eq2_r:In"  }
                    { output = "eq2_r:Out"           input = "eq3_r:In"  }
                    { output = "eq3_r:Out"           input = "eq4_r:In"  }
                    { output = "eq4_r:Out"           input = "eq5_r:In"  }
                    { output = "eq5_r:Out"           input = "eq6_r:In"  }
                    { output = "eq6_r:Out"           input = "eq7_r:In"  }
                    { output = "eq7_r:Out"           input = "eq8_r:In"  }
                ]
                inputs  = [ "bass_enhancer:in_l" "bass_enhancer:in_r" ]
                outputs = [ "eq8_l:Out" "eq8_r:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "gts9wifi_speaker_eq"
                node.description = "平板内置扬声器 (调音)"
                media.class      = Audio/Sink
                priority.session = 1500
                priority.driver  = 1500
            }
            playback.props = {
                node.name     = "gts9wifi_speaker_eq_out"
                node.passive  = true
                target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
            }
        }
    }
]
